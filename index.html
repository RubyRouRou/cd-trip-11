<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>成都 11/10–14｜行程＋記帳</title>
<meta name="theme-color" content="#8f2b22">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦀</text></svg>">
<style>
  :root{--ink:#241d1a;--muted:#7b6f68;--line:#e8ddd2;--paper:#fbf7f1;--card:#fffdfa;--red:#b23a2f;--green:#2f6b4f}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC",system-ui,sans-serif;line-height:1.6;-webkit-text-size-adjust:100%}
  .wrap{max-width:640px;margin:0 auto;padding:22px 16px 56px}
  header{background:linear-gradient(135deg,#8f2b22,#b23a2f 60%,#c95a3d);color:#fff;border-radius:16px;padding:24px 22px;margin-bottom:18px}
  header .k{font-size:12px;letter-spacing:.2em;opacity:.85}
  h1{margin:6px 0 6px;font-size:24px;line-height:1.25}
  header p{margin:0;font-size:13.5px;opacity:.92}
  .card{display:block;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:14px;text-decoration:none;color:inherit}
  .card h2{margin:0 0 6px;font-size:18px}
  .card .desc{font-size:13.5px;color:var(--muted);margin:0}
  .go{display:inline-block;margin-top:14px;background:var(--red);color:#fff;border-radius:11px;padding:11px 18px;font-size:15px;font-weight:700}
  .pw{display:inline-block;background:#eef5f1;color:var(--green);border:1px solid #cfe3d7;border-radius:8px;padding:2px 10px;font-weight:700;font-size:13.5px}
  .tip{font-size:13px;color:#5a4f48;background:#fff9ec;border:1px solid #f0e2c4;border-radius:12px;padding:12px 14px;margin-top:8px}
  footer{text-align:center;color:var(--muted);font-size:12px;margin-top:22px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="k">CHENGDU · 11/10–11/14</div>
    <h1>成都 5 天 4 晚<br>行程 ＋ 旅費記帳</h1>
    <p>點下面的卡片就能開，不用密碼、不用 token。</p>
  </header>

  <a class="card" href="itinerary.html">
    <h2>① 行程計畫書</h2>
    <p class="desc">每天 2–3 個點、午後留白、打車為主；每站附高德導航與店搜尋。</p>
    <span class="go">開啟行程</span>
  </a>

  <a class="card" href="aa.html">
    <h2>② 旅費 AA 記帳</h2>
    <p class="desc">柔姐 / Jill 兩人帳。資料存在<b>各支手機</b>，可匯出／匯入備份互相同步。</p>
    <span class="pw">資料只存本機</span>
    <span class="go" style="margin-left:8px">開啟記帳</span>
  </a>

  <div class="tip">
    <b>建議做法：</b>兩個頁面都按瀏覽器「加到主畫面」，出國期間像 App 一樣點開。<br>
    記帳資料不會上傳，離線也記得了；回國或換手機時用「匯出備份」把 JSON 傳給對方匯入。
  </div>

  <footer>叮噹 🔔 ｜ 給柔姐的成都 5 天 4 晚</footer>
</div>
</body>
</html>
